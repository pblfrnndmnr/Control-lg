<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Remote Body Outline -->
  <rect x="136" y="56" width="240" height="400" rx="64" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Red Power Button at Top -->
  <circle cx="256" cy="120" r="32" fill="url(#redGrad)" filter="url(#glow)" />
  <!-- Power Icon inside -->
  <path d="M256 102v18" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M242 108a16 16 0 1 0 28 0" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- LG Text Brand mark -->
  <text x="256" y="195" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">LG ThinQ</text>

  <!-- Circular D-Pad Outer Ring -->
  <circle cx="256" cy="290" r="70" fill="#0f172a" stroke="#475569" stroke-width="4" />
  <!-- Center OK Wheel -->
  <circle cx="256" cy="290" r="28" fill="url(#redGrad)" />
  <text x="256" y="296" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">OK</text>

  <!-- D-Pad Arrows -->
  <path d="M256 232l-8 10h16z" fill="#94a3b8" />
  <path d="M256 348l-8-10h16z" fill="#94a3b8" />
  <path d="M198 290l10-8v16z" fill="#94a3b8" />
  <path d="M314 290l-10-8v16z" fill="#94a3b8" />

  <!-- Bottom Volume & Channel Rockers -->
  <rect x="176" y="380" width="36" height="44" rx="12" fill="#334155" />
  <text x="194" y="407" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>

  <rect x="300" y="380" width="36" height="44" rx="12" fill="#334155" />
  <text x="318" y="407" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CH</text>
</svg>
