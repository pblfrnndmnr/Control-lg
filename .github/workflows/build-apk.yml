name: Compilar APK Android LG Remote

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del proyecto
        run: |
          npm install
          npm install --save @capacitor/core @capacitor/android @capacitor/cli

      - name: Compilar App Web de Producción
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Instalar Android SDK 36 y Aceptar Licencias
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63831872d90783f4762d79f4f14fe07b\n84831b9409646a518e32b31499fc02f2b970e65d\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n856352d0422bf23a34fb04d842c599ad3d8eb723" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Preparar Proyecto Android con Permisos y Certificados
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat << 'EOF' > capacitor.config.json
            {
              "appId": "com.lgremote.thinq",
              "appName": "LG Remote",
              "webDir": "dist",
              "server": {
                "cleartext": true,
                "androidScheme": "http"
              },
              "android": {
                "allowMixedContent": true
              }
            }
          EOF
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # 1. Crear configuración de seguridad de red para permitir HTTP y certificados locales
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">192.168.0.0/16</domain>
                  <domain includeSubdomains="true">10.0.0.0/8</domain>
                  <domain includeSubdomains="true">172.16.0.0/12</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">127.0.0.1</domain>
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </domain-config>
          </network-security-config>
          EOF

          # 2. Habilitar usesCleartextTraffic y networkSecurityConfig en AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/g' android/app/src/main/AndroidManifest.xml || true

          # 3. Inyectar MainActivity que autoriza certificados SSL autofirmados de televisores LG
          cat << 'EOF' > android/app/src/main/java/com/lgremote/thinq/MainActivity.java
          package com.lgremote.thinq;

          import android.net.http.SslError;
          import android.os.Bundle;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  try {
                      WebView webView = this.getBridge().getWebView();
                      if (webView != null) {
                          WebSettings settings = webView.getSettings();
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                          settings.setDomStorageEnabled(true);
                          webView.setWebViewClient(new BridgeWebViewClient(this.getBridge()) {
                              @Override
                              public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                                  handler.proceed();
                              }
                          });
                      }
                  } catch (Exception e) {}
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} ./LG-Remote-v1.0.0-debug.apk \;

      - name: Publicar y Descargar APK Compilada
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-Android-APK
          path: LG-Remote-v1.0.0-debug.apk
          retention-days: 14