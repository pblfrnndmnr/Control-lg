name: Compilar APK Android LG Remote

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm ci || npm install

      - name: Compilar App Web de Producción
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar Proyecto Android nativo (Capacitor)
        run: |
          npx --yes @capacitor/cli init "LG Remote" "com.lgremote.thinq" --web-dir dist
          npx --yes @capacitor/cli add android
          npx --yes @capacitor/cli copy android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./LG-Remote-v1.0.0-debug.apk

      - name: Publicar y Descargar APK Compilada
        uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-Android-APK
          path: LG-Remote-v1.0.0-debug.apk
          retention-days: 14
