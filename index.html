<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        // Suppress Vite HMR WebSocket errors in AI Studio cloud preview environment
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = (reason && reason.stack) || '';
            if (msg && (msg.indexOf('WebSocket closed without opened') !== -1 || stack.indexOf('@vite/client') !== -1)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });
          window.addEventListener('error', function(event) {
            var msg = event && (event.message || '');
            var filename = event && (event.filename || '');
            if (msg.indexOf('WebSocket closed without opened') !== -1 || filename.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });
          if (window.WebSocket) {
            var NativeWS = window.WebSocket;
            function FakeHmrWS(url, protocols) {
              var isHmr = protocols === 'vite-hmr' || 
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));
              if (isHmr) {
                var target = new EventTarget();
                target.readyState = 1;
                target.OPEN = 1;
                target.CONNECTING = 0;
                target.CLOSING = 2;
                target.CLOSED = 3;
                target.url = url || '';
                target.protocol = 'vite-hmr';
                target.send = function() {};
                target.close = function() {};
                return target;
              }
              return new NativeWS(url, protocols);
            }
            FakeHmrWS.CONNECTING = 0;
            FakeHmrWS.OPEN = 1;
            FakeHmrWS.CLOSING = 2;
            FakeHmrWS.CLOSED = 3;
            FakeHmrWS.prototype = NativeWS.prototype;
            window.WebSocket = FakeHmrWS;
          }
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator) {
        var registerSW = function() {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(function(registration) {
              console.log('[PWA] Service Worker registrado exitosamente con scope:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[PWA] Error al registrar Service Worker:', error);
            });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('DOMContentLoaded', registerSW);
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </body>
